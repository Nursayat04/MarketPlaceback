version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  main-app:
    build:
      context: .
      dockerfile: main-app.Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - db
    restart: always

  review-app:
    build:
      context: .
      dockerfile: review-service.Dockerfile
    ports:
      - "8081:8081"
    depends_on:
      - db
    restart: always